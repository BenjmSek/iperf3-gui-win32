; autotest.ini — 回归测试用例参数
;
; 由 test/run_autotest.py 读取；编排器会把选中的用例重编号为 case_00… 后**回写本文件**
; （GUI 固定读 <exe目录>\test\autotest.ini，且总是从 case_00 开始跑），运行结束自动还原。
;
; [autotest]
;   case_count  用例总数（编排器按实际选中数重写，手改无效）
;   server_ip   客户端用例的默认目标 IP
;
; [case_NN] 可用键（对应 main.c AutoTest_StartNext 的读取项）
;   mode      = client | server
;   proto     = tcp | udp
;   format    = k m g t K M G T（留空 = 自适应）
;   ip        目标 IP（缺省取 server_ip）
;   port      端口（缺省 5201）
;   duration  时长秒（缺省 5；编排器 --duration 会重写）
;   interval  上报间隔秒（缺省 1）
;   bw        带宽 -b，仅 UDP 生效
;   extra     追加到命令行的原始参数
;   num       传输量 -n
;   parallel   并发流数 -P（缺省 1；必须显式写，否则沿用 settings.ini 的值）
;   omit      防抖 -O 秒
;   reverse / bidir / json / getserver / oneoff / verbose = 0 | 1
;
; 顺序约定：**服务端用例必须排在最后**。server 用例启动前会 taskkill 掉所有 iperf3.exe
; （含编排器为 client 用例拉起的常驻服务端），放前面会打断后续 client 用例。
;
; UDP 用例一律 parallel=1：Cygwin 版 iperf3 3.21 在 -u 叠加 -P>1 时会直接报
; "unable to read from stream socket: Resource temporarily unavailable" 并退出 1
; （实机验证：P=2/4/8 都复现，P=1 正常）。这是 iperf3 侧的限制，不是 GUI 的 bug，
; 因此 UDP 多流不在回归矩阵覆盖范围内。

[autotest]
case_count = 17
server_ip = 127.0.0.1

; ---- 客户端：协议 × -f 单位 ----
[case_00]
mode = client
proto = tcp

[case_01]
mode = client
proto = tcp
format = m

[case_02]
mode = client
proto = tcp
format = g

; ---- 客户端：方向 ----
[case_03]
mode = client
proto = tcp
reverse = 1

[case_04]
mode = client
proto = tcp
bidir = 1

[case_05]
mode = client
proto = udp
bidir = 1

; ---- 客户端：UDP ----
parallel = 1

[case_06]
mode = client
proto = udp
parallel = 1

[case_07]
mode = client
proto = udp
bw = 50M
parallel = 1

[case_08]
mode = client
proto = udp
reverse = 1

; ---- 客户端：JSON ----
parallel = 1

[case_09]
mode = client
proto = tcp
json = 1

[case_10]
mode = client
proto = udp
json = 1

; ---- 客户端：其它开关 ----
parallel = 1

[case_11]
mode = client
proto = tcp
getserver = 1

[case_12]
mode = client
proto = tcp
omit = 2

; duration 必须是 10：iperf3 不允许 -t 与 -n 同时出现（"only one test end
; condition"），而 GUI 只在 duration != 10 时才输出 -t。num 用例因此不参与
; --duration 重写。
[case_13]
mode = client
proto = tcp
num = 500M
duration = 10

; ---- 服务端（必须排在最后）----
[case_14]
mode = server
proto = tcp
oneoff = 1

[case_15]
mode = server
proto = tcp
verbose = 1

[case_16]
mode = server
proto = udp
oneoff = 1
parallel = 1

